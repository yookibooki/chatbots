<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
    * {
        box-sizing: border-box
    }

    body {
        margin: 0;
        height: 100dvh;
        display: grid;
        gap: clamp(8px, 1.2vw, 16px);
        background: #121212;
        place-content: center;
        padding: clamp(8px, 1.2vw, 16px)
    }

    a {
        position: relative;
        text-decoration: none;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        background: #1e1e1e;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8% 8% 16% 8%;
        overflow: hidden;
    }

    img {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        object-fit: contain;
        z-index: 1;
    }

    a::before {
        content: attr(data-intelligence);
        position: absolute;
        top: 0;
        left: 0;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        color: #ffffff;
        padding: 6px 10px;
        border-top-left-radius: 16px;
        border-bottom-right-radius: 8px;
        font: 600 clamp(10px, 1.8vmin, 14px)/1 system-ui, sans-serif;
        z-index: 2;
    }

    a::after {
        content: attr(data-model);
        position: absolute;
        bottom: 0;
        right: 0;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        color: #ffffff;
        padding: 6px 10px;
        border-bottom-right-radius: 16px;
        border-top-left-radius: 8px;
        font: 600 clamp(10px, 1.8vmin, 14px)/1 system-ui, sans-serif;
        z-index: 2;
    }
</style>
<body>
<script>
    const fit = () => {
        const n = document.querySelectorAll("a").length, s = getComputedStyle(document.body), p = parseFloat(s.paddingLeft), g = parseFloat(s.gap), w = document.body.clientWidth - p * 2, h = innerHeight - p * 2;
        let c = 1, z = 0;
        for (let i = 1; i <= n; i++) {const r = Math.ceil(n / i), y = Math.min((w - g * (i - 1)) / i, (h - g * (r - 1)) / r); if (y > z || Math.abs(y - z) < .01 && i > c) c = i, z = y}
        document.body.style.cssText = `grid-template-columns:repeat(${c},${z | 0}px);grid-auto-rows:${z | 0}px`;
    };
    const ro = new ResizeObserver(fit); ro.observe(document.body);
    new MutationObserver(fit).observe(document.body, {childList: true});
</script>
