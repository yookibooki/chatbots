<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Chatbots</title>
<style>
    :root {
        --bg: #121212;
        --card: #1e1e1e;
        --chip: rgba(255, 255, 255, 0.1);
        --text: #ffffff;
        --radius: 16px;
        --gap: clamp(8px, 1.2vw, 16px);
        --pad: clamp(8px, 1.2vw, 16px);
        --blur: blur(8px);
    }

    * {
        box-sizing: border-box
    }

    body {
        margin: 0;
        height: 100dvh;
        display: grid;
        gap: var(--gap);
        background: var(--bg);
        place-content: center;
        overflow: hidden;
        padding: var(--pad)
    }

    a {
        position: relative;
        text-decoration: none;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        background: var(--card);
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8%;
        overflow: hidden;
    }

    img {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        object-fit: contain;
        z-index: 1;
    }

    .hide {
        display: none !important
    }

    a::before,
    a::after {
        position: absolute;
        background: var(--chip);
        backdrop-filter: var(--blur);
        color: var(--text);
        padding: 6px 10px;
        font: 600 clamp(10px, 1.8vmin, 14px)/1 system-ui, sans-serif;
        z-index: 2;
    }

    a::before {
        content: attr(data-score);
        top: 0;
        left: 0;
        border-top-left-radius: var(--radius);
        border-bottom-right-radius: 8px;
    }

    a::after {
        content: attr(data-model);
        bottom: 0;
        right: 0;
        border-bottom-right-radius: var(--radius);
        border-top-left-radius: 8px;
    }
</style>

<body>
<a id="claude" class="hide" href="https://claude.ai/new" data-score="41" data-model="Sonnet 5.5"><img alt="Sonnet 5.5 logo" src="icons/claude.svg"></a>

<noscript><style>.hide { display: flex !important }</style></noscript>
<script>
    'use strict';

    const SCHEDULE = { days: [1, 2, 3, 4, 5], from: 13, to: 19 };
    const LOOKAHEAD_DAYS = 8;
    const EDGE_DELAY_MS = 250;
    const SIZE_EPSILON = 0.01;

    const body = document.body;
    const claude = document.getElementById('claude');
    const px = value => Number.parseFloat(value) || 0;

    let rendered = '';
    const fit = () => {
        const visible = body.querySelectorAll('a:not(.hide)').length;
        const style = getComputedStyle(body);
        const pad = px(style.paddingLeft);
        const gap = px(style.gap);
        const width = body.clientWidth - pad * 2;
        const height = body.clientHeight - pad * 2;

        let cols = 1, best = 0;
        for (let c = 1; c <= visible; c++) {
            const rows = Math.ceil(visible / c);
            const size = Math.min(
                (width - gap * (c - 1)) / c,
                (height - gap * (rows - 1)) / rows
            );
            if (size > best || (Math.abs(size - best) < SIZE_EPSILON && c > cols)) {
                cols = c;
                best = size;
            }
        }

        const size = Math.max(1, Math.floor(best));
        const key = `${cols}x${size}`;
        if (key === rendered) return;
        rendered = key;
        body.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
        body.style.gridAutoRows = `${size}px`;
    };

    const sortCards = () => {
        const cards = [...body.querySelectorAll('a[data-score]')];
        const sorted = [...cards].sort((a, b) => (+b.dataset.score || 0) - (+a.dataset.score || 0));
        for (let i = 0; i < cards.length; i++) {
            if (cards[i] !== sorted[i]) {
                for (const card of sorted) body.append(card);
                return;
            }
        }
    };

    const isPeak = (now = new Date()) =>
        SCHEDULE.days.includes(now.getUTCDay()) &&
        now.getUTCHours() >= SCHEDULE.from &&
        now.getUTCHours() < SCHEDULE.to;

    const nextEdge = (now = new Date()) => {
        for (let offset = 0; offset <= LOOKAHEAD_DAYS; offset++) {
            for (const hour of [SCHEDULE.from, SCHEDULE.to]) {
                const at = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + offset, hour);
                if (at <= now.getTime()) continue;
                if (isPeak(new Date(at - 1)) !== isPeak(new Date(at))) return at;
            }
        }
        return null;
    };

    let peak = null;
    const applyState = (now = new Date()) => {
        const hidden = isPeak(now);
        if (hidden === peak) return;
        peak = hidden;
        claude?.classList.toggle('hide', hidden);
        fit();
    };

    let timer = null;
    const refresh = () => {
        clearTimeout(timer);
        applyState();
        const edge = nextEdge();
        if (edge == null) return;
        timer = setTimeout(refresh, edge - Date.now() + EDGE_DELAY_MS);
    };

    sortCards();
    refresh();

    const wake = () => { if (!document.hidden) refresh(); };
    document.addEventListener('visibilitychange', wake);
    window.addEventListener('pageshow', wake);

    new ResizeObserver(fit).observe(body);
    new MutationObserver(() => { sortCards(); fit(); })
        .observe(body, { childList: true, subtree: true });
</script>
