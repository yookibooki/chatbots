<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
    * {
        box-sizing: border-box
    }

    body {
        margin: 0;
        height: 100dvh;
        display: grid;
        gap: clamp(8px, 1.2vw, 16px);
        background: #121212;
        place-content: center;
        padding: clamp(8px, 1.2vw, 16px)
    }

    a {
        position: relative;
        text-decoration: none;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        background: #1e1e1e;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8% 8% 16% 8%;
        overflow: hidden;
    }

    img {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        object-fit: contain;
        z-index: 1;
    }

    a::before {
        content: attr(data-score);
        position: absolute;
        top: 0;
        left: 0;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        color: #ffffff;
        padding: 6px 10px;
        border-top-left-radius: 16px;
        border-bottom-right-radius: 8px;
        font: 600 clamp(10px, 1.8vmin, 14px)/1 system-ui, sans-serif;
        z-index: 2;
    }

    a::after {
        content: attr(data-model);
        position: absolute;
        bottom: 0;
        right: 0;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        color: #ffffff;
        padding: 6px 10px;
        border-bottom-right-radius: 16px;
        border-top-left-radius: 8px;
        font: 600 clamp(10px, 1.8vmin, 14px)/1 system-ui, sans-serif;
        z-index: 2;
    }
</style>

<script>
    const fit = () => {
        const n = document.querySelectorAll("a"), s = getComputedStyle(document.body), g = parseFloat(s.gap), w = document.body.clientWidth - parseFloat(s.paddingLeft) - parseFloat(s.paddingRight), h = innerHeight - parseFloat(s.paddingTop) - parseFloat(s.paddingBottom);
        let columns = 1, size = 0;
        for (let c = 1; c <= n.length; c++) {const rows = Math.ceil(n.length / c), next = Math.min((w - g * (c - 1)) / c, (h - g * (rows - 1)) / rows); if (next > size || Math.abs(next - size) < .01 && c > columns) {columns = c; size = next}}
        document.body.style.gridTemplateColumns = `repeat(${columns},${size}px)`;
        document.body.style.gridAutoRows = `${size}px`;
    };
    new MutationObserver(fit).observe(document.body, {childList: true});
    addEventListener("resize", fit);
    fit();
</script>
